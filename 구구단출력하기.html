<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>구구단 출력하기</h1>
</body>
<script>
    let i = 2;
    let n = 1;
    for(i=2; i<=9; i++){
        for(n=1; n<=9; n++)
        document.write(i+'*'+n+'='+(i*n)+'<br>')
    }
    document.write('<br>');
</script>
</html>
